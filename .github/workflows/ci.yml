name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Test suite (PHP ${{ matrix.php }} + JS)
    runs-on: ubuntu-latest
    # 8.4 is what the production host runs; 8.5 is what development uses (EA-7 / O-09).
    # Coverage is measured on the 8.5 leg (pcov) and gated (see the step below).
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            coverage: none
          - php: '8.5'
            coverage: pcov
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, bcmath, gd, zip, mbstring, intl, pcntl, sodium
          coverage: ${{ matrix.coverage }}

      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
        env:
          # config/broadcasting.php defaults BROADCAST_CONNECTION to 'reverb';
          # with no .env on the runner, package:discover (post-autoload-dump)
          # would boot the app and try to construct that broadcaster.
          BROADCAST_CONNECTION: log

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies & build assets
        run: |
          npm ci --silent
          npm run build

      - name: Generate throwaway CI app key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Run PHP test suite
        # phpunit directly with the details shown: `artisan test --compact`
        # reported "955 warnings" and hid what they were (EA-4 / O-08).
        run: |
          if [ "${{ matrix.coverage }}" = "pcov" ]; then
            # The whole per-class table, summary first: the floor step below reads the summary line, and the table
            # says WHERE coverage is thin when it has to be raised (R2-10).
            php -d memory_limit=-1 vendor/bin/phpunit --display-warnings --display-deprecations --display-phpunit-deprecations --coverage-text=coverage.txt
            cat coverage.txt
          else
            php -d memory_limit=-1 vendor/bin/phpunit --display-warnings --display-deprecations --display-phpunit-deprecations
          fi
        env:
          # phpunit.xml already forces sqlite/:memory: and AI_PROVIDER=mock,
          # so no database service container or real API keys are needed here.
          BROADCAST_CONNECTION: log

      - name: Line coverage must not fall below the floor
        # EA-7 / O-07: measured on every run; the build fails if line coverage of app/ drops below
        # COVERAGE_FLOOR. Raise the floor as coverage grows; never lower it to make a change pass.
        if: matrix.coverage == 'pcov'
        env:
          # First measured 87.74% (EA-7, run on PR #214); raised to 90 in R2-10 (89.54% before its new tests).
          COVERAGE_FLOOR: '90'
        run: |
          # The report carries colour codes: strip them before reading the figure.
          LINES=$(sed 's/\x1b\[[0-9;]*m//g' coverage.txt | grep -m1 -E 'Lines:' | grep -oE '[0-9]+\.[0-9]+' | head -1)
          [ -n "$LINES" ] || { echo "::error::Could not read the line coverage from coverage.txt."; cat coverage.txt; exit 1; }
          echo "Line coverage: ${LINES}% (floor ${COVERAGE_FLOOR}%)"
          awk -v l="$LINES" -v f="$COVERAGE_FLOOR" 'BEGIN { exit !(l + 0 >= f + 0) }' || { echo "::error::Line coverage ${LINES}% is below the floor ${COVERAGE_FLOOR}%."; exit 1; }

      - name: Run JS test suite
        run: node --test tests/js/*.test.js

  browser:
    name: Browser suite (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # EA-7 / O-06: the real journeys in a real browser (sign in, write and autosave, share and remove,
    # publish behind a password, export, the assistant, keyboard, a phone) and axe on every main screen
    # (critical violations fail; serious ones are listed in the log). tests/Browser/README in the config.
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, bcmath, gd, zip, mbstring, intl, sodium
          coverage: none
      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
        env:
          BROADCAST_CONNECTION: log
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Node dependencies, build assets, install Chromium
        run: |
          npm ci --silent
          npm run build
          npx playwright install --with-deps chromium
      - name: Run the browser suite
        run: npm run test:browser
        env:
          CI: 'true'
      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/Browser/playwright-report
            tests/Browser/test-results
          retention-days: 7

  code-style:
    name: Pint (code style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, mbstring
          coverage: none
      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
        env:
          BROADCAST_CONNECTION: log
      - name: Run Pint (fail on style violations)
        run: vendor/bin/pint --test

  static-php:
    name: PHPStan (static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, mbstring
          coverage: none
      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
        env:
          BROADCAST_CONNECTION: log
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --error-format=github

  composer-audit:
    name: Composer dependency audit
    runs-on: ubuntu-latest
    # Gates the quality gate on HIGH, CRITICAL and UNRATED advisories (EA-1 /
    # S-15): every merge deploys production, so a known serious hole must
    # not ship. Low and medium are printed and do not block.
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
        env:
          BROADCAST_CONNECTION: log
      - name: composer audit (blocks on high and critical)
        run: |
          composer audit || true
          composer audit --format=json > audit.json || true
          # Unrated advisories block too: Symfony and FriendsOfPHP advisories
          # usually carry no severity. Accept one deliberately with
          # composer.json "config.audit.ignore", never by weakening this.
          SERIOUS=$(jq '[.advisories // {} | to_entries[] | .value | (if type == "object" then .[] else .[] end) | select(((.severity // "unrated") | test("high|critical|unrated"; "i")))] | length' audit.json)
          echo "High, critical or unrated advisories: ${SERIOUS:-unreadable}"
          test "${SERIOUS:-1}" -eq 0

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    # Same rule as composer-audit: high and critical block the gate.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --silent
      - name: npm audit (high and critical only)
        run: npm audit --audit-level=high

  workflow-lint:
    name: Workflow lint (actionlint + shellcheck)
    runs-on: ubuntu-latest
    # R2-2: a workflow GitHub cannot parse merged once (#212) and deployed nothing. actionlint checks every
    # workflow's syntax, expressions and (through shellcheck) its shell steps, plus the deploy's host scripts.
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - name: shellcheck the deploy's host scripts
        run: shellcheck scripts/deploy/*.sh

  quality-gate:
    name: Quality gate (all checks must pass)
    runs-on: ubuntu-latest
    # The dependency audits gate too, on high and critical advisories only
    # (EA-1 / S-15): a merge here is a production deploy.
    needs: [tests, browser, code-style, static-php, composer-audit, npm-audit, workflow-lint]
    if: always()
    steps:
      - name: Evaluate quality gate
        run: |
          declare -A results
          results[tests]="${{ needs.tests.result }}"
          results[browser]="${{ needs.browser.result }}"
          results[code-style]="${{ needs.code-style.result }}"
          results[static-php]="${{ needs.static-php.result }}"
          results[composer-audit]="${{ needs.composer-audit.result }}"
          results[npm-audit]="${{ needs.npm-audit.result }}"
          results[workflow-lint]="${{ needs.workflow-lint.result }}"
          failed=0
          for job in "${!results[@]}"; do
            if [ "${results[$job]}" != "success" ]; then
              echo "FAILED: $job -> ${results[$job]}"
              failed=1
            else
              echo "PASSED: $job"
            fi
          done
          if [ $failed -eq 1 ]; then
            echo ""
            echo "Quality gate failed -- one or more required checks did not pass."
            exit 1
          fi
          echo ""
          echo "All quality gates passed."
