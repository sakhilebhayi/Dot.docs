name: Deploy to Production

# Deploys automatically on every push to main (i.e. every merge), and can
# also be triggered manually from the Actions tab (or
# `gh workflow run deploy.yml -f confirm=deploy`) to redeploy the current
# main without a new merge - e.g. after a manual server-side fix. Run
# bootstrap.yml once, first, on a new server -- this workflow assumes
# .env, the database, and the two systemd services already exist.
#
# The "Quality gate (all checks must pass)" status check is REQUIRED on
# main's branch protection specifically because of the line above: with
# auto-deploy on, a merge IS a deploy, so a red CI run must never be
# mergeable in the first place - the gate is the only thing standing
# between a broken PR and production.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm deploying main to production'
        required: true

concurrency:
  group: dot-doc-production-deploy
  cancel-in-progress: false

env:
  # The public production URL. Only the last step's smoke check uses it,
  # over plain HTTPS from the runner like any visitor - never over SSH.
  SITE_URL: https://doc.infodot.co.za

jobs:
  deploy:
    name: Deploy main to doc.infodot.co.za
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Refuse unconfirmed manual runs
        # Only gates workflow_dispatch: a push event carries no `inputs` at
        # all (the merge itself is the confirmation), so this step is a
        # no-op there rather than refusing every automatic deploy outright.
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'deploy' }}
        run: |
          echo '::error::Confirmation input was not "deploy" -- aborting.'
          exit 1

      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci --silent
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy code and run migrations
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="$DEPLOY_PATH" \
              'bash -s' <<'DEPLOY'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          PHP=php

          echo "== Current release: $(git rev-parse --short HEAD)"

          git fetch origin main

          # Maintenance mode only for the risky window (migrations).
          $PHP artisan down --retry=30 || true

          git reset --hard origin/main

          # Production invariant (ecosystem audit 2026-10-17, defect D9): with
          # APP_DEBUG=true any error, even a harmless 405, answers every
          # visitor with a ~840 KB debug page (source, stack frames, server
          # paths). Force it off on every deploy, BEFORE the config cache is
          # built, so a hand-edited .env cannot quietly put it back.
          if [ -f .env ]; then
            if grep -q '^APP_DEBUG=' .env; then
              sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
            else
              printf '\nAPP_DEBUG=false\n' >> .env
            fi
            echo "== APP_DEBUG forced to false: $(grep '^APP_DEBUG=' .env | tail -1)"
          fi
          composer install --no-interaction --optimize-autoloader --no-dev

          $PHP artisan migrate --force

          $PHP artisan config:cache
          $PHP artisan route:cache
          $PHP artisan view:cache
          $PHP artisan event:cache

          # ---- public/storage -> ../storage/app/public
          # User uploads are served from public/storage. A symlink left over from an earlier location (an absolute path
          # that no longer exists) answers 404 for every upload, and it breaks outright once the document root becomes
          # <app>/public. This points the link at the relative target `artisan storage:link` creates, repairs a broken or
          # misdirected link, and leaves a correct one alone. It NEVER removes a real directory or file called storage
          # (that is warned about and left as it is) and can never fail the deploy: the body is a subshell with `set +e`.
          ensure_storage_link() (
            set +e
            TARGET="../storage/app/public"
            LINK="public/storage"
            if ! mkdir -p storage/app/public 2>/dev/null; then echo "::warning::storage link: could not create storage/app/public (deploy continues)"; exit 0; fi
            if [ ! -d public ]; then echo "== storage link: skipped (no public/ folder)"; exit 0; fi
            if [ -L "$LINK" ]; then
              CUR="$(readlink "$LINK")"
              if [ -d "$LINK" ] && [ "$(cd -P "$LINK" 2>/dev/null && pwd -P)" = "$(cd -P storage/app/public && pwd -P)" ]; then
                echo "== storage link: ok ($LINK -> $CUR)"
              elif ln -sfn "$TARGET" "$LINK"; then
                echo "== storage link: repaired ($LINK pointed at $CUR, now $TARGET)"
              else
                echo "::warning::storage link: could not repair $LINK (it points at $CUR); uploads may not be served (deploy continues)"
              fi
            elif [ -d "$LINK" ]; then
              echo "::warning::storage link: skipped (real directory) -- $LINK is a real directory, not a symlink; left as it is. Move its files into storage/app/public and remove it by hand to serve uploads from there."
            elif [ -e "$LINK" ]; then
              echo "::warning::storage link: skipped (real file) -- $LINK is a file, not a symlink; left as it is."
            elif ln -s "$TARGET" "$LINK"; then
              echo "== storage link: created ($LINK -> $TARGET)"
            else
              echo "::warning::storage link: could not create $LINK (deploy continues)"
            fi
            exit 0
          )
          ensure_storage_link || true
          DEPLOY

      - name: Transfer public assets to the real docroot
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          SSH='ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes'
          DEST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"

          # This account's docroot for doc.infodot.co.za is DEPLOY_PATH's
          # PARENT directory, not DEPLOY_PATH/public - confirmed live via
          # `uapi DomainInfo single_domain_data`. It's a shared-hosting
          # "flattened" Laravel layout: a hand-written index.php sits
          # directly at the docroot and boots DEPLOY_PATH's vendor/
          # bootstrap by a DIFFERENT relative path than this repo's own
          # public/index.php uses - NEVER sync index.php here, it would
          # break every request on the site instantly. Every other static
          # file (build/, favicons, robots.txt, sw.js, images/) has its own
          # untouched copy sitting directly at the docroot, dated from the
          # original manual deploy - this step used to sync public/build/
          # to DEPLOY_PATH/public/build/, a path the webserver never serves
          # at all, so Laravel kept correctly reading ITS OWN current
          # manifest.json and emitting correct hashes while the BROWSER'S
          # request for those exact asset URLs 404'd against the real,
          # never-updated docroot copy - looked exactly like a stale cache
          # for days; DEPLOY_PATH/public/build was the wrong destination ON
          # ITS OWN. It is still the right SECOND destination (below): @vite
          # reads its manifest, so every build goes to both.
          REAL_DOCROOT=$(dirname "$DEPLOY_PATH")

          # build/ gets its own --delete-scoped sync so old content-hashed
          # files (renamed every time their source changes) don't
          # accumulate forever. --delete here only ever touches files
          # already under $REAL_DOCROOT/build/, nothing else at the docroot.
          rsync -az --delete -e "$SSH" public/build/ "$DEST:$REAL_DOCROOT/build/"

          # ...and the SAME build to DEPLOY_PATH/public/build/ too. The
          # browser fetches assets from the docroot copy above, but @vite
          # reads public_path('build/manifest.json'), which is INSIDE
          # DEPLOY_PATH, to choose the hashed filenames it writes into the
          # HTML. public/build is gitignored, so `git reset --hard` never
          # refreshes it: skip this line and the HTML names files the
          # docroot's --delete has already removed. The two copies must
          # never diverge - both come from this one build, every deploy.
          rsync -az --delete -e "$SSH" public/build/ "$DEST:$DEPLOY_PATH/public/build/"

          # Everything else under public/ EXCEPT index.php and build/
          # (handled above). No --delete: the docroot also holds doc/ (this
          # app's own source - DEPLOY_PATH itself lives there), an old
          # Dot.docs.tar.gz, and .well-known (ACME/SSL) - none of which
          # exist under this repo's public/, so a --delete sync of the
          # whole docroot would wipe all three.
          rsync -az -e "$SSH" --exclude='index.php' --exclude='build' \
            public/ "$DEST:$REAL_DOCROOT/"

      - name: Restart services and go live
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="$DEPLOY_PATH" \
              'bash -s' <<'RESTART'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          PHP=php

          # ---- crontab: repair this app's lines, never touch anyone else's ----
          # Rule for this account: the crontab is written only by deploy
          # workflows, each touches only lines carrying its own marker, and a
          # write is verified before and after. 2026-08-31: a pipeline whose read
          # failed installed an EMPTY crontab and silently killed Dot.Mines'
          # scheduler for six weeks. cron runs with a minimal PATH, so lines carry
          # the absolute PHP path and keep their last output in a log file.
          MARK="# dot-doc"
          # One writer at a time on this account: deploys of different apps can
          # coincide and would otherwise race on the single crontab.
          command -v flock > /dev/null || { echo "::error::flock is not installed on the host; crontab writes cannot be serialised"; exit 1; }
          exec 9>"$HOME/.dot-crontab.lock"; flock -w 120 9 || { echo "::error::could not take the crontab lock within 120 s (another deploy is writing the crontab)"; exit 1; }
          PHP_BIN="$(command -v "${PHP:-php}")"
          OLD="$(mktemp)"; NEW="$(mktemp)"; CHK="$(mktemp)"; ERR="$(mktemp)"
          # crontab -l on this host can transiently answer empty (seen 2026-10-16,
          # right after a write, under the lock). A read is trusted only when it
          # is non-empty or the host says there is no crontab; otherwise retry.
          read_crontab() {
            local i
            for i in 1 2 3 4 5; do
              if crontab -l > "$1" 2> "$ERR"; then
                [ -s "$1" ] && return 0
              elif grep -qi "no crontab for" "$ERR"; then
                : > "$1"; return 0
              fi
              sleep 2
            done
            return 1
          }
          if ! read_crontab "$OLD"; then
            echo "::error::crontab -l answered empty or failed five times ($(cat "$ERR")). Refusing to write a crontab I could not read."; exit 1
          fi
          KEY="${MARK#\# dot-}"
          EXPECT_MINE=1
          OTHERS=$(grep -v "$MARK" "$OLD" | grep -c . || true)
          {
            grep -v "$MARK" "$OLD" || true
            echo "* * * * * cd $DEPLOY_PATH && exec $PHP_BIN artisan schedule:run > storage/logs/cron-scheduler.log 2>&1 $MARK"
          } > "$NEW"
          # Runner mode (InfoDot docs/programme R-1): when the account runs the bounded-concurrency cron runner
          # (InfoDot: Cron Runner workflow, "install"), this app's commands go to ~/.dot-cron.d/$KEY.cron and the
          # runner starts them, at most 4 at a time, away from second 0. Its own crontab lines are removed (a migration
          # on deploy). Without the runner the lines above are installed as before.
          if [ -x "$HOME/bin/dot-cron-runner" ] && grep -q '# dot-cron-runner' "$OLD"; then
            CMDS="$(grep -F -- "$MARK" "$NEW" | sed -E 's/^[^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ //; s/ *# dot-[a-z0-9-]*$//' || true)"
            mkdir -p "$HOME/.dot-cron.d"
            if [ -n "$CMDS" ]; then
              printf '%s\n' "$CMDS" > "$HOME/.dot-cron.d/$KEY.cron.tmp" && mv "$HOME/.dot-cron.d/$KEY.cron.tmp" "$HOME/.dot-cron.d/$KEY.cron"
            else
              rm -f "$HOME/.dot-cron.d/$KEY.cron"
            fi
            grep -v -F -- "$MARK" "$NEW" > "$NEW.t" || true; mv "$NEW.t" "$NEW"
            EXPECT_MINE=0
            echo "== runner mode: $(printf '%s' "$CMDS" | grep -c . || true) command(s) written to ~/.dot-cron.d/$KEY.cron, none left in the crontab"
          fi
          crontab "$NEW"
          read_crontab "$CHK" || : > "$CHK"
          AFTER=$(grep -v "$MARK" "$CHK" | grep -c . || true)
          MINE=$(grep -c "$MARK" "$CHK" || true)
          if [ "$AFTER" != "$OTHERS" ] || [ "$MINE" != "$EXPECT_MINE" ]; then
            crontab "$OLD"
            echo "::error::crontab verification failed (other lines before=$OTHERS after=$AFTER, mine=$MINE, expected=$EXPECT_MINE); the previous crontab was restored."; exit 1
          fi
          rm -f "$OLD" "$NEW" "$CHK" "$ERR"; flock -u 9
          echo "== crontab: $MINE line(s) for $MARK installed, $OTHERS other line(s) preserved"

          # queue:restart signals workers to finish their current job and
          # exit; systemd's Restart=always then spins up a fresh one --
          # zero-downtime, no direct process kill.
          $PHP artisan queue:restart

          # Reverb serves compiled code from boot; reload it if sudoers
          # allows (VPS only -- on shared hosting `sudo` may not even exist
          # as a binary, which exits 127, not just "permission denied", so
          # this is guarded the same way either way). Mirrors Dot.Mines'
          # deploy.yml, the reference implementation for this same shared
          # cPanel account.
          if sudo -n systemctl reload dot-doc-reverb.service 2>/dev/null; then
            echo "Reverb reloaded."
          else
            echo "::warning::Reverb was not reloaded (no sudo/systemd here). If a Reverb process runs on this host it is still serving the PREVIOUS release until reloaded manually."
          fi

          $PHP artisan up
          echo "== Deployed: $(git rev-parse --short HEAD)"

          # LiteSpeed's LSCache (server-level, cPanel-side) full-page-caches
          # HTML responses regardless of this app's own Cache-Control header.
          # public/.htaccess opts the app out (CacheLookup off), but that
          # .htaccess only reaches the real docroot now that the step above
          # syncs it there - requesting the signed purge URL here is cheap
          # defense in depth in case anything was cached before that applied.
          # See public/.htaccess and PurgeLiteSpeedCache.
          PURGE_URL=$($PHP artisan cache:purge-litespeed)
          if curl -fsS -o /dev/null "$PURGE_URL"; then
            echo "LSCache purge requested."
          else
            echo "::warning::LSCache purge request failed -- the live site may still serve a stale cached page until it is purged some other way."
          fi
          RESTART

      - name: Smoke-check the live site
        # Last step, on purpose: a deploy is green only once the live
        # pages have been seen loading their own assets. Runs on the
        # runner with plain curl (no SSH), exactly as a browser would: /
        # and /login must answer 200, and every $SITE_URL/build/ asset
        # either page references must answer 200 too. A page with NO
        # build references fails as well - every page here loads the app
        # bundle, so zero matches means the page is broken.
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          FAILED=0
          : > "$WORK/assets"

          for PAGE in "$SITE_URL/" "$SITE_URL/login"; do
            STATUS=$(curl -s --max-time 30 -o "$WORK/page.html" -w '%{http_code}' "$PAGE" || true)
            if [ "$STATUS" != "200" ]; then
              echo "::error::$PAGE answered ${STATUS:-no response} (expected 200)"
              FAILED=1
              continue
            fi
            echo "200 $PAGE"

            # Every href/src value that starts with $SITE_URL/build/.
            # grep exits 1 on no match; only that is tolerated here.
            { grep -oE "(href|src)=[\"'][^\"']*" "$WORK/page.html" || [ "$?" -eq 1 ]; } \
              | sed -E "s/^(href|src)=[\"']//" \
              | awk -v prefix="$SITE_URL/build/" 'index($0, prefix) == 1' \
              | sort -u > "$WORK/refs"
            if [ ! -s "$WORK/refs" ]; then
              echo "::error::$PAGE references no $SITE_URL/build/ assets; every page here loads the app bundle, so this page is broken"
              FAILED=1
              continue
            fi
            cat "$WORK/refs" >> "$WORK/assets"
          done

          sort -u "$WORK/assets" > "$WORK/unique"
          while IFS= read -r ASSET; do
            STATUS=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' "$ASSET" || true)
            if [ "$STATUS" = "200" ]; then
              echo "200 $ASSET"
            else
              echo "::error::$ASSET answered ${STATUS:-no response} (expected 200)"
              FAILED=1
            fi
          done < "$WORK/unique"

          # No debug page. POST to /up (a GET-only route) is a harmless 405: a
          # production app answers it with ~1 KB, a debug-mode one with a
          # stack-trace page of several hundred KB.
          curl -s --max-time 30 -o "$WORK/probe.html" -X POST "$SITE_URL/up" || true
          if grep -qiE 'vendor/laravel|stack trace' "$WORK/probe.html" 2>/dev/null; then
            echo "::error::POST $SITE_URL/up answered with a debug error page ($(wc -c < "$WORK/probe.html" | tr -d ' ') bytes): APP_DEBUG is still on. Check the production .env and the config cache."
            FAILED=1
          else
            echo "No debug page on POST $SITE_URL/up ($(wc -c < "$WORK/probe.html" | tr -d ' ') bytes)."
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Smoke check failed: the live site does not load its own pages or build assets (see above). The deploy is NOT healthy."
            exit 1
          fi
          echo "== Smoke check passed: $SITE_URL/ and $SITE_URL/login answered 200, and so did all $(wc -l < "$WORK/unique" | tr -d ' ') build asset(s) they reference (listed above)."

      - name: Probe the application folder from outside
        # Public requests only (no SSH, nothing is read): the app folder next to the docroot
        # must answer 403/404 (or a 301/302 to the login), never 200. Found 2026-10-20
        # serving its database, logs and vendor/ on four platforms. Runs after the site is
        # live again, so it can only turn the run red. Only status codes are printed.
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          KEY="$(basename "$DEPLOY_PATH")"
          [ -n "$KEY" ] && [ "$KEY" != "/" ] || { echo "::error::cannot work out the app folder name; the probe did not run"; exit 1; }
          EXPOSED=0
          UNREACHED=0
          for P in .env .env.bak-secrets artisan composer.json composer.lock database/database.sqlite storage/logs/laravel.log vendor/autoload.php phpunit.xml; do
            CODE=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$SITE_URL/$KEY/$P" || true)
            case "$CODE" in
              200) echo "::error::EXPOSED /$KEY/$P answered 200"; EXPOSED=1 ;;
              000) echo "000 /$KEY/$P (no answer)"; UNREACHED=$((UNREACHED + 1)) ;;
              *) echo "$CODE /$KEY/$P" ;;
            esac
          done
          [ "$UNREACHED" -eq 0 ] || echo "::warning::$UNREACHED probe request(s) got no answer; those paths are unverified."
          if [ "$EXPOSED" -ne 0 ]; then
            echo "::error::The application folder is readable over HTTP (database, logs or vendor/ may be downloadable). Run the App Folder Guard workflow in InfoDot (mode apply) or add the deny file by hand, then re-run."
            exit 1
          fi
          echo "== App-folder probe: no sensitive path answered 200 ($((9 - UNREACHED)) of 9 paths verified)."
