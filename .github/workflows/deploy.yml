name: Deploy to Production

# Deploys automatically after every merge to main once CI has passed on it, and can
# also be triggered manually from the Actions tab (or
# `gh workflow run deploy.yml -f confirm=deploy`) to redeploy the current
# main without a new merge - e.g. after a manual server-side fix. Run
# bootstrap.yml once, first, on a new server -- this workflow assumes
# .env, the database, and the two systemd services already exist.
#
# The "Quality gate (all checks must pass)" status check is REQUIRED on
# main's branch protection specifically because of the line above: with
# auto-deploy on, a merge IS a deploy, so a red CI run must never be
# mergeable in the first place - the gate is the only thing standing
# between a broken PR and production.
on:
  # R2-2: a merge deploys only once CI has passed ON MAIN for that commit. Before, this ran on the push itself, in
  # parallel with CI, so a red CI on main (seen for d4b9069) still deployed. If CI on main fails for a flaky reason,
  # "Re-run failed jobs" on that CI run; its success starts the deploy.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm deploying main to production'
        required: true

concurrency:
  group: dot-doc-production-deploy
  cancel-in-progress: false

env:
  # The public production URL. Only the last step's smoke check uses it,
  # over plain HTTPS from the runner like any visitor - never over SSH.
  SITE_URL: https://doc.infodot.co.za

jobs:
  deploy:
    name: Deploy main to doc.infodot.co.za
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A CI run that failed, or ran for something other than a push to main, deploys nothing.
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    env:
      # The commit CI passed (workflow_run) or the current main (manual run). Built, deployed and checked as one.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Refuse unconfirmed manual runs
        # Only gates workflow_dispatch: a push event carries no `inputs` at
        # all (the merge itself is the confirmation), so this step is a
        # no-op there rather than refusing every automatic deploy outright.
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'deploy' }}
        run: |
          echo '::error::Confirmation input was not "deploy" -- aborting.'
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci --silent
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy code and run migrations
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          # The commit CI tested and this run built the assets from (EA-6 / O-11; job env above).
          # `origin/main` at fetch time could be a later merge.
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="$DEPLOY_PATH" DEPLOY_SHA="$DEPLOY_SHA" \
              'bash -s' <<'DEPLOY'
          # -E: the ERR trap below also fires for failures inside functions.
          set -Eeuo pipefail
          cd "$DEPLOY_PATH"
          PHP=php

          PREV="$(git rev-parse HEAD)"
          echo "== Current release: $(git rev-parse --short HEAD)"

          git fetch origin main
          git cat-file -e "$DEPLOY_SHA^{commit}" || { echo "::error::commit $DEPLOY_SHA was not fetched from origin/main"; exit 1; }
          # Never deploy an OLDER commit than the one running (EA-6): "Re-run jobs" on
          # an old workflow run would otherwise put old code on a newer schema. A
          # redeploy of the same commit, or any newer one, passes.
          if ! git merge-base --is-ancestor "$PREV" "$DEPLOY_SHA"; then
            echo "::error::$DEPLOY_SHA is not newer than the running release ${PREV:0:9}. Deploy the current main instead (Actions > Deploy to Production > Run workflow)."
            exit 1
          fi

          # ---- What a rollback after a failed smoke check needs (R2-2): the running release's commit, and its
          # built assets (public/build is not in git, and the asset step replaces it with --delete).
          printf '%s\n' "$PREV" > storage/app/deploy-previous-release
          # Kept outside public/, so it is never served.
          rm -rf storage/app/build.prev
          if [ -d public/build ]; then cp -a public/build storage/app/build.prev; fi

          # ---- A verified database copy BEFORE anything changes (EA-6 / O-03).
          # The SQLite online backup is consistent with writers active and needs
          # none of this release's code: the sqlite3 tool when the host has it,
          # PHP's SQLite3::backup otherwise. The deploy stops here, with the site
          # untouched, if the copy cannot be made or fails its integrity check.
          # The newest five pre-deploy copies are kept (NOT encrypted: they never
          # leave this host; see docs/programme/RESTORE_RUNBOOK.md).
          DB_FILE="database/database.sqlite"
          PRE=""
          if [ -f "$DB_FILE" ]; then
            mkdir -p storage/backups
            PRE="storage/backups/predeploy-$(date -u +%Y%m%dT%H%M%SZ)-${DEPLOY_SHA:0:9}.sqlite"
            CHECK="$($PHP -r '
              $from = new SQLite3($argv[1], SQLITE3_OPEN_READONLY);
              $to = new SQLite3($argv[2]);
              if (! $from->backup($to)) { echo "backup failed"; exit(1); }
              $to->exec("PRAGMA journal_mode=DELETE");
              echo (string) $to->querySingle("PRAGMA integrity_check");
              $to->close(); $from->close();
            ' "$DB_FILE" "$PRE" 2>&1 || true)"
            rm -f "$PRE-shm" "$PRE-wal"
            if [ "$CHECK" != "ok" ]; then
              echo "::error::pre-deploy backup failed ($CHECK); nothing was changed"; rm -f "$PRE"; exit 1
            fi
            ls -1t storage/backups/predeploy-*.sqlite 2>/dev/null | tail -n +6 | xargs -r rm -f
            echo "== Pre-deploy backup: $PRE ($(wc -c < "$PRE") bytes, integrity ok)"
          else
            echo "::warning::no $DB_FILE here; no pre-deploy backup taken"
          fi

          # Document root already moved to <app>/public (the standard layout, S-2e in InfoDot's SECURITY_ASSESSMENT)?
          # Then the tracked root .htaccess (Require all denied, written for the flattened layout where the app folder
          # sits INSIDE the web root) would sit in the PARENT of the document root and refuse every request. LiteSpeed
          # reads .htaccess files of parent folders. Every `git reset --hard` restores it - the release's AND a
          # rollback's - so this runs after each of them. In the flattened layout nothing changes.
          apply_layout() {
            local app_real current_docroot
            app_real="$(pwd -P)"
            current_docroot="$(uapi --output=json DomainInfo single_domain_data domain=doc.infodot.co.za 2>/dev/null | sed -n 's/.*"documentroot" *: *"\([^"]*\)".*/\1/p' | head -1 || true)"
            if [ "$current_docroot" = "$app_real/public" ] || [ -f .docroot-is-public ]; then
              echo "== document root is $app_real/public (standard layout)"
              if [ -f .htaccess ]; then
                mv -f .htaccess .htaccess.docroot-is-public-disabled && echo "== app-folder .htaccess: moved aside (the document root is public/)" || echo "::warning::could not move .htaccess aside"
              fi
            else
              echo "== document root is the app folder's parent (flattened layout): app-folder .htaccess stays"
            fi
          }

          # If anything from here to the end of this step fails (composer, a
          # migration, the caches), put the previous release back and take the
          # site out of maintenance mode instead of leaving it down (EA-6 / O-04).
          # A migration is NOT undone automatically: the pre-deploy backup is the
          # way back (docs/programme/RESTORE_RUNBOOK.md).
          MIGRATED=no
          rollback() {
            trap - ERR
            echo "::error::Deploy failed; putting release ${PREV:0:9} back."
            git reset --hard "$PREV" || true
            apply_layout || true
            composer install --no-interaction --optimize-autoloader --no-dev || true
            $PHP artisan config:cache || true
            $PHP artisan route:cache || true
            $PHP artisan view:cache || true
            $PHP artisan up || true
            if [ "$MIGRATED" = "yes" ]; then
              echo "::error::The new release's migrations HAD run: release ${PREV:0:9} now runs on the newer schema. Check the site; if it misbehaves, restore ${PRE:-the newest backup} as the runbook says."
            else
              echo "::error::Site is up on release ${PREV:0:9}. If a migration ran part-way, restore ${PRE:-the newest backup} as the runbook says."
            fi
          }
          trap 'rollback' ERR

          # Maintenance mode only for the risky window (migrations).
          $PHP artisan down --retry=30 || true

          git reset --hard "$DEPLOY_SHA"
          apply_layout

          # Production invariant (ecosystem audit 2026-10-17, defect D9): with
          # APP_DEBUG=true any error, even a harmless 405, answers every
          # visitor with a ~840 KB debug page (source, stack frames, server
          # paths). Force it off on every deploy, BEFORE the config cache is
          # built, so a hand-edited .env cannot quietly put it back.
          if [ -f .env ]; then
            if grep -q '^APP_DEBUG=' .env; then
              sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
            else
              printf '\nAPP_DEBUG=false\n' >> .env
            fi
            echo "== APP_DEBUG forced to false: $(grep '^APP_DEBUG=' .env | tail -1)"
          fi
          composer install --no-interaction --optimize-autoloader --no-dev

          $PHP artisan migrate --force
          MIGRATED=yes

          $PHP artisan config:cache
          $PHP artisan route:cache
          $PHP artisan view:cache
          $PHP artisan event:cache

          # ---- public/storage -> ../storage/app/public
          # User uploads are served from public/storage. A symlink left over from an earlier location (an absolute path
          # that no longer exists) answers 404 for every upload, and it breaks outright once the document root becomes
          # <app>/public. This points the link at the relative target `artisan storage:link` creates, repairs a broken or
          # misdirected link, and leaves a correct one alone. It NEVER removes a real directory or file called storage
          # (that is warned about and left as it is) and can never fail the deploy: the body is a subshell with `set +e`.
          ensure_storage_link() (
            set +e
            TARGET="../storage/app/public"
            LINK="public/storage"
            if ! mkdir -p storage/app/public 2>/dev/null; then echo "::warning::storage link: could not create storage/app/public (deploy continues)"; exit 0; fi
            if [ ! -d public ]; then echo "== storage link: skipped (no public/ folder)"; exit 0; fi
            if [ -L "$LINK" ]; then
              CUR="$(readlink "$LINK")"
              if [ -d "$LINK" ] && [ "$(cd -P "$LINK" 2>/dev/null && pwd -P)" = "$(cd -P storage/app/public && pwd -P)" ]; then
                echo "== storage link: ok ($LINK -> $CUR)"
              elif ln -sfn "$TARGET" "$LINK"; then
                echo "== storage link: repaired ($LINK pointed at $CUR, now $TARGET)"
              else
                echo "::warning::storage link: could not repair $LINK (it points at $CUR); uploads may not be served (deploy continues)"
              fi
            elif [ -d "$LINK" ]; then
              echo "::warning::storage link: skipped (real directory) -- $LINK is a real directory, not a symlink; left as it is. Move its files into storage/app/public and remove it by hand to serve uploads from there."
            elif [ -e "$LINK" ]; then
              echo "::warning::storage link: skipped (real file) -- $LINK is a file, not a symlink; left as it is."
            elif ln -s "$TARGET" "$LINK"; then
              echo "== storage link: created ($LINK -> $TARGET)"
            else
              echo "::warning::storage link: could not create $LINK (deploy continues)"
            fi
            exit 0
          )
          ensure_storage_link || true
          trap - ERR
          DEPLOY

      - name: Transfer public assets to the real docroot
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          SSH='ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes'
          DEST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"

          # This account's docroot for doc.infodot.co.za is DEPLOY_PATH's
          # PARENT directory, not DEPLOY_PATH/public - confirmed live via
          # `uapi DomainInfo single_domain_data`. It's a shared-hosting
          # "flattened" Laravel layout: a hand-written index.php sits
          # directly at the docroot and boots DEPLOY_PATH's vendor/
          # bootstrap by a DIFFERENT relative path than this repo's own
          # public/index.php uses - NEVER sync index.php here, it would
          # break every request on the site instantly. Every other static
          # file (build/, favicons, robots.txt, sw.js, images/) has its own
          # untouched copy sitting directly at the docroot, dated from the
          # original manual deploy - this step used to sync public/build/
          # to DEPLOY_PATH/public/build/, a path the webserver never serves
          # at all, so Laravel kept correctly reading ITS OWN current
          # manifest.json and emitting correct hashes while the BROWSER'S
          # request for those exact asset URLs 404'd against the real,
          # never-updated docroot copy - looked exactly like a stale cache
          # for days; DEPLOY_PATH/public/build was the wrong destination ON
          # ITS OWN. It is still the right SECOND destination (below): @vite
          # reads its manifest, so every build goes to both.
          APP_REAL=$($SSH "$DEST" "cd '$DEPLOY_PATH' && pwd -P")
          CURRENT_DOCROOT=$($SSH "$DEST" "uapi --output=json DomainInfo single_domain_data domain=doc.infodot.co.za 2>/dev/null | sed -n 's/.*\"documentroot\" *: *\"\([^\"]*\)\".*/\1/p' | head -1" || true)
          if [ -n "$APP_REAL" ] && [ "$CURRENT_DOCROOT" = "$APP_REAL/public" ]; then
            # Standard layout (S-2e): the document root IS DEPLOY_PATH/public, so everything tracked under public/ is
            # already in place after the code step, and only the gitignored build/ has to be written, once.
            echo "== document root is $APP_REAL/public: syncing build/ in place only"
            rsync -az --delete -e "$SSH" public/build/ "$DEST:$DEPLOY_PATH/public/build/"
            exit 0
          fi
          REAL_DOCROOT=$(dirname "$DEPLOY_PATH")

          # build/ gets its own --delete-scoped sync so old content-hashed
          # files (renamed every time their source changes) don't
          # accumulate forever. --delete here only ever touches files
          # already under $REAL_DOCROOT/build/, nothing else at the docroot.
          rsync -az --delete -e "$SSH" public/build/ "$DEST:$REAL_DOCROOT/build/"

          # ...and the SAME build to DEPLOY_PATH/public/build/ too. The
          # browser fetches assets from the docroot copy above, but @vite
          # reads public_path('build/manifest.json'), which is INSIDE
          # DEPLOY_PATH, to choose the hashed filenames it writes into the
          # HTML. public/build is gitignored, so `git reset --hard` never
          # refreshes it: skip this line and the HTML names files the
          # docroot's --delete has already removed. The two copies must
          # never diverge - both come from this one build, every deploy.
          rsync -az --delete -e "$SSH" public/build/ "$DEST:$DEPLOY_PATH/public/build/"

          # Everything else under public/ EXCEPT index.php and build/
          # (handled above). No --delete: the docroot also holds doc/ (this
          # app's own source - DEPLOY_PATH itself lives there), an old
          # Dot.docs.tar.gz, and .well-known (ACME/SSL) - none of which
          # exist under this repo's public/, so a --delete sync of the
          # whole docroot would wipe all three.
          rsync -az -e "$SSH" --exclude='index.php' --exclude='build' \
            public/ "$DEST:$REAL_DOCROOT/"

      - name: Restart services and go live
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="$DEPLOY_PATH" \
              'bash -s' <<'RESTART'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          PHP=php

          # ---- crontab: repair this app's lines, never touch anyone else's ----
          # Rule for this account: the crontab is written only by deploy
          # workflows, each touches only lines carrying its own marker, and a
          # write is verified before and after. 2026-08-31: a pipeline whose read
          # failed installed an EMPTY crontab and silently killed Dot.Mines'
          # scheduler for six weeks. cron runs with a minimal PATH, so lines carry
          # the absolute PHP path and keep their last output in a log file.
          MARK="# dot-doc"
          # One writer at a time on this account: deploys of different apps can
          # coincide and would otherwise race on the single crontab.
          command -v flock > /dev/null || { echo "::error::flock is not installed on the host; crontab writes cannot be serialised"; exit 1; }
          exec 9>"$HOME/.dot-crontab.lock"; flock -w 120 9 || { echo "::error::could not take the crontab lock within 120 s (another deploy is writing the crontab)"; exit 1; }
          PHP_BIN="$(command -v "${PHP:-php}")"
          OLD="$(mktemp)"; NEW="$(mktemp)"; CHK="$(mktemp)"; ERR="$(mktemp)"
          # crontab -l on this host can transiently answer empty (seen 2026-10-16,
          # right after a write, under the lock). A read is trusted only when it
          # is non-empty or the host says there is no crontab; otherwise retry.
          read_crontab() {
            local i
            for i in 1 2 3 4 5; do
              if crontab -l > "$1" 2> "$ERR"; then
                [ -s "$1" ] && return 0
              elif grep -qi "no crontab for" "$ERR"; then
                : > "$1"; return 0
              fi
              sleep 2
            done
            return 1
          }
          if ! read_crontab "$OLD"; then
            echo "::error::crontab -l answered empty or failed five times ($(cat "$ERR")). Refusing to write a crontab I could not read."; exit 1
          fi
          KEY="${MARK#\# dot-}"
          EXPECT_MINE=1
          OTHERS=$(grep -v "$MARK" "$OLD" | grep -c . || true)
          {
            grep -v "$MARK" "$OLD" || true
            echo "* * * * * cd $DEPLOY_PATH && exec $PHP_BIN artisan schedule:run > storage/logs/cron-scheduler.log 2>&1 $MARK"
          } > "$NEW"
          # Runner mode (InfoDot docs/programme R-1): when the account runs the bounded-concurrency cron runner
          # (InfoDot: Cron Runner workflow, "install"), this app's commands go to ~/.dot-cron.d/$KEY.cron and the
          # runner starts them, at most 4 at a time, away from second 0. Its own crontab lines are removed (a migration
          # on deploy). Without the runner the lines above are installed as before.
          if [ -x "$HOME/bin/dot-cron-runner" ] && grep -q '# dot-cron-runner' "$OLD"; then
            CMDS="$(grep -F -- "$MARK" "$NEW" | sed -E 's/^[^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ //; s/ *# dot-[a-z0-9-]*$//' || true)"
            mkdir -p "$HOME/.dot-cron.d"
            if [ -n "$CMDS" ]; then
              printf '%s\n' "$CMDS" > "$HOME/.dot-cron.d/$KEY.cron.tmp" && mv "$HOME/.dot-cron.d/$KEY.cron.tmp" "$HOME/.dot-cron.d/$KEY.cron"
            else
              rm -f "$HOME/.dot-cron.d/$KEY.cron"
            fi
            grep -v -F -- "$MARK" "$NEW" > "$NEW.t" || true; mv "$NEW.t" "$NEW"
            EXPECT_MINE=0
            echo "== runner mode: $(printf '%s' "$CMDS" | grep -c . || true) command(s) written to ~/.dot-cron.d/$KEY.cron, none left in the crontab"
          fi
          crontab "$NEW"
          read_crontab "$CHK" || : > "$CHK"
          AFTER=$(grep -v "$MARK" "$CHK" | grep -c . || true)
          MINE=$(grep -c "$MARK" "$CHK" || true)
          if [ "$AFTER" != "$OTHERS" ] || [ "$MINE" != "$EXPECT_MINE" ]; then
            crontab "$OLD"
            echo "::error::crontab verification failed (other lines before=$OTHERS after=$AFTER, mine=$MINE, expected=$EXPECT_MINE); the previous crontab was restored."; exit 1
          fi
          rm -f "$OLD" "$NEW" "$CHK" "$ERR"; flock -u 9
          echo "== crontab: $MINE line(s) for $MARK installed, $OTHERS other line(s) preserved"

          # queue:restart signals workers to finish their current job and
          # exit; systemd's Restart=always then spins up a fresh one --
          # zero-downtime, no direct process kill.
          $PHP artisan queue:restart

          # Reverb serves compiled code from boot; reload it if sudoers
          # allows (VPS only -- on shared hosting `sudo` may not even exist
          # as a binary, which exits 127, not just "permission denied", so
          # this is guarded the same way either way). Mirrors Dot.Mines'
          # deploy.yml, the reference implementation for this same shared
          # cPanel account.
          if sudo -n systemctl reload dot-doc-reverb.service 2>/dev/null; then
            echo "Reverb reloaded."
          else
            echo "::warning::Reverb was not reloaded (no sudo/systemd here). If a Reverb process runs on this host it is still serving the PREVIOUS release until reloaded manually."
          fi

          $PHP artisan up
          echo "== Deployed: $(git rev-parse --short HEAD)"

          # LiteSpeed's LSCache (server-level, cPanel-side) full-page-caches
          # HTML responses regardless of this app's own Cache-Control header.
          # public/.htaccess opts the app out (CacheLookup off), but that
          # .htaccess only reaches the real docroot now that the step above
          # syncs it there - requesting the signed purge URL here is cheap
          # defense in depth in case anything was cached before that applied.
          # See public/.htaccess and PurgeLiteSpeedCache.
          PURGE_URL=$($PHP artisan cache:purge-litespeed)
          if curl -fsS -o /dev/null "$PURGE_URL"; then
            echo "LSCache purge requested."
          else
            echo "::warning::LSCache purge request failed -- the live site may still serve a stale cached page until it is purged some other way."
          fi
          RESTART

      - name: Never leave the site in maintenance mode
        # EA-6 / O-04: the code step puts the site in maintenance mode and the
        # "go live" step takes it out. If the asset transfer, the crontab or the
        # go-live step itself fails in between, the site would stay on 503 with
        # the new code. This runs only after a failure and only takes the site
        # out of maintenance mode; the run stays red.
        if: failure()
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "cd '$DEPLOY_PATH' && php artisan up" \
            && echo "::warning::The deploy failed; the site was taken out of maintenance mode (see the steps above for what failed)." \
            || echo "::error::Could not take the site out of maintenance mode. Run 'php artisan up' in the app folder by hand."

      - name: Smoke-check the live site from the host
        # R2-2: the deciding health check runs ON THE HOST (scripts/deploy/smoke-check.sh), through its own
        # loopback when the web server answers there, so the host's bot protection - which answered GitHub's
        # runners with its own page on 2026-11-27 and turned healthy deploys red - never sees it.
        id: host_smoke
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        # The script answers 0 healthy, 1 unhealthy (the app answered and is broken: roll back), 2 inconclusive (the
        # app could not be reached: red, but nothing is rolled back on no evidence).
        run: |
          RC=0
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "cd '$DEPLOY_PATH' && SITE_URL='$SITE_URL' bash scripts/deploy/smoke-check.sh" || RC=$?
          case "$RC" in
            0) echo "result=healthy" >> "$GITHUB_OUTPUT" ;;
            1) echo "result=unhealthy" >> "$GITHUB_OUTPUT" ;;
            *) echo "result=inconclusive" >> "$GITHUB_OUTPUT" ;;
          esac
          exit "$RC"

      - name: Roll back when the live site is unhealthy
        # R2-2 / O-04: the new code went live but failed its health check. Put the previous release back - code,
        # dependencies, caches and its own built assets - and check again. Migrations are NOT reversed: the
        # pre-deploy database copy is the way back (docs/programme/RESTORE_RUNBOOK.md). The run stays red.
        if: ${{ failure() && steps.host_smoke.outputs.result == 'unhealthy' }}
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="$DEPLOY_PATH" SITE_URL="$SITE_URL" \
              'bash -s' <<'ROLLBACK'
          set -uo pipefail
          # No `set -e` here (each step reports and the rollback carries on), so a failed cd must stop it: every
          # line below runs git and artisan in the current folder.
          cd "$DEPLOY_PATH" || { echo "::error::cannot enter the app folder; nothing was rolled back"; exit 1; }
          PREV="$(cat storage/app/deploy-previous-release 2>/dev/null || true)"
          if [ -z "$PREV" ] || ! git cat-file -e "$PREV^{commit}" 2>/dev/null; then
            echo "::error::No previous release recorded; nothing was rolled back. Fix forward or restore by hand (RESTORE_RUNBOOK.md section 4)."; exit 1
          fi
          # The check script is part of the release being removed: keep a copy to check the rollback with.
          cp scripts/deploy/smoke-check.sh storage/app/smoke-check.sh
          echo "::error::Rolling back to ${PREV:0:9}: the new release went live but failed its health check."
          php artisan down --retry=30 || true
          git reset --hard "$PREV"
          if [ -f .docroot-is-public ] || [ "$(uapi --output=json DomainInfo single_domain_data domain=doc.infodot.co.za 2>/dev/null | sed -n 's/.*"documentroot" *: *"\([^"]*\)".*/\1/p' | head -1)" = "$(pwd -P)/public" ]; then
            [ -f .htaccess ] && mv -f .htaccess .htaccess.docroot-is-public-disabled
            DOCROOT_BUILD=""
          else
            DOCROOT_BUILD="$(dirname "$(pwd -P)")/build"
          fi
          composer install --no-interaction --optimize-autoloader --no-dev || echo "::warning::composer install failed during the rollback"
          if [ -d storage/app/build.prev ]; then
            rm -rf public/build && cp -a storage/app/build.prev public/build
            if [ -n "$DOCROOT_BUILD" ]; then rm -rf "$DOCROOT_BUILD" && cp -a storage/app/build.prev "$DOCROOT_BUILD"; fi
          else
            echo "::warning::no saved build of ${PREV:0:9}; its pages may name assets that are gone"
          fi
          # Every cache the failed release built (config, routes, views, events) goes, then the old release's are built.
          php artisan optimize:clear || echo "::warning::clearing the caches failed"
          { php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan event:cache; } || echo "::warning::rebuilding the caches failed"
          php artisan queue:restart || true
          # Never leave the site in maintenance mode, even if artisan itself is broken.
          php artisan up || { rm -f storage/framework/down; echo "::warning::artisan up failed; the maintenance file was removed by hand"; }
          # The page cache may hold pages of the failed release (the health check fetched them) naming its assets.
          PURGE_URL="$(php artisan cache:purge-litespeed 2>/dev/null || true)"
          if [ -n "$PURGE_URL" ] && curl -fsS -o /dev/null "$PURGE_URL"; then echo "LSCache purge requested."; else echo "::warning::LSCache purge failed after the rollback"; fi
          echo "::error::Rolled back to $(git rev-parse --short HEAD). Migrations of the failed release, if any, were NOT reversed."
          if SITE_URL="$SITE_URL" bash storage/app/smoke-check.sh; then
            echo "== The previous release is healthy again."
          else
            echo "::error::The previous release did not pass the check either: look at the site, and restore by hand if needed (RESTORE_RUNBOOK.md section 4)."
          fi
          exit 1
          ROLLBACK

      - name: Check the live site from outside (advisory)
        # The same checks from GitHub's runner, as a visitor elsewhere would see the site. Advisory since R2-2: the
        # host's bot protection sometimes answers runners with its own page, so a failure here is a warning and the
        # host check above decides.
        continue-on-error: true
        # Last step, on purpose: a deploy is green only once the live
        # pages have been seen loading their own assets. Runs on the
        # runner with plain curl (no SSH), exactly as a browser would: /
        # must answer 200 (/login may instead hand over to central sign-in), and every $SITE_URL/build/ asset
        # either page references must answer 200 too. A page with NO
        # build references fails as well - every page here loads the app
        # bundle, so zero matches means the page is broken.
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          FAILED=0
          : > "$WORK/assets"

          # The host's edge firewall sometimes answers a GitHub runner with its own block or challenge page
          # (a 403, or a 200 of ~12 KB with none of the app in it) - seen 2026-11-27 while the site was healthy
          # for everyone else. So a page is fetched up to four times, 20 s apart, until it is the app; only
          # an answer that is still not the app after that fails the check (EA-7 follow-up).
          is_app_page() { grep -qF "$SITE_URL/build/" "$1" 2>/dev/null; }
          for PAGE in "$SITE_URL/" "$SITE_URL/login"; do
            for ATTEMPT in 1 2 3 4; do
              STATUS=$(curl -s --max-time 30 -o "$WORK/page.html" -D "$WORK/page.headers" -w '%{http_code}' "$PAGE" || true)
              STATUS="${STATUS:-000}"
              if [ "$STATUS" = "200" ] && is_app_page "$WORK/page.html"; then break; fi
              if [ "$PAGE" = "$SITE_URL/login" ] && [ "$STATUS" = "302" ]; then break; fi
              if [ "$ATTEMPT" -lt 4 ]; then
                echo "attempt $ATTEMPT: $PAGE answered $STATUS ($(wc -c < "$WORK/page.html" | tr -d ' ') bytes) without the app's assets - possibly the host's firewall refusing this runner; retrying in 20 s"
                sleep 20
              fi
            done
            # The security headers are checked on the response that proved to be the app, never on a separate fetch.
            if [ "$PAGE" = "$SITE_URL/" ]; then cp "$WORK/page.headers" "$WORK/headers.txt"; fi

            # Central sign-in (R-54, DOTSSO_ENABLED): /login hands over to this app's own /sso/login instead of showing a form. That is a
            # healthy answer. It is accepted only for that exact redirect, and the target must itself answer (a redirect or a page),
            # never an error. There is no page to scan for assets in that case, so the loop moves on.
            if [ "$PAGE" = "$SITE_URL/login" ] && [ "$STATUS" = "302" ]; then
              TARGET=$(curl -s --max-time 30 -o /dev/null -w '%{redirect_url}' "$PAGE" || true)
              if [ "$TARGET" = "$SITE_URL/sso/login" ]; then
                HOP=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' "$TARGET" || true)
                case "$HOP" in
                  200|302) echo "302 $PAGE -> $TARGET ($HOP): central sign-in is on"; continue ;;
                  *) echo "::error::$PAGE redirects to central sign-in, but $TARGET answered ${HOP:-no response}"; FAILED=1; continue ;;
                esac
              fi
            fi

            if [ "$STATUS" != "200" ]; then
              echo "::error::$PAGE answered ${STATUS:-no response} (expected 200)"
              FAILED=1
              continue
            fi
            echo "200 $PAGE"

            # Every href/src value that starts with $SITE_URL/build/.
            # grep exits 1 on no match; only that is tolerated here.
            { grep -oE "(href|src)=[\"'][^\"']*" "$WORK/page.html" || [ "$?" -eq 1 ]; } \
              | sed -E "s/^(href|src)=[\"']//" \
              | awk -v prefix="$SITE_URL/build/" 'index($0, prefix) == 1' \
              | sort -u > "$WORK/refs"
            if [ ! -s "$WORK/refs" ]; then
              echo "::error::$PAGE references no $SITE_URL/build/ assets; every page here loads the app bundle, so this page is broken"
              FAILED=1
              continue
            fi
            cat "$WORK/refs" >> "$WORK/assets"
          done

          sort -u "$WORK/assets" > "$WORK/unique"
          while IFS= read -r ASSET; do
            STATUS=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' "$ASSET" || true)
            if [ "$STATUS" = "200" ]; then
              echo "200 $ASSET"
            else
              echo "::error::$ASSET answered ${STATUS:-no response} (expected 200)"
              FAILED=1
            fi
          done < "$WORK/unique"

          # No debug page. POST to /up (a GET-only route) is a harmless 405: a
          # production app answers it with ~1 KB, a debug-mode one with a
          # stack-trace page of several hundred KB.
          curl -s --max-time 30 -o "$WORK/probe.html" -X POST "$SITE_URL/up" || true
          if grep -qiE 'vendor/laravel|stack trace' "$WORK/probe.html" 2>/dev/null; then
            echo "::error::POST $SITE_URL/up answered with a debug error page ($(wc -c < "$WORK/probe.html" | tr -d ' ') bytes): APP_DEBUG is still on. Check the production .env and the config cache."
            FAILED=1
          else
            echo "No debug page on POST $SITE_URL/up ($(wc -c < "$WORK/probe.html" | tr -d ' ') bytes)."
          fi

          # Security headers (App\Http\Middleware\SecurityHeaders) must reach the
          # browser: a host or cache layer that drops them would otherwise go
          # unnoticed, as it did before EA-1 (none were sent at all).
          for H in x-content-type-options x-frame-options referrer-policy; do
            if grep -qi "^$H:" "$WORK/headers.txt"; then
              echo "Header present: $H"
            else
              echo "::error::$SITE_URL/ answered without the $H header."
              FAILED=1
            fi
          done
          # The Content-Security-Policy is enforced since R2-1. SECURITY_CSP_ENFORCE=false
          # in .env sends it report-only instead (the rollback switch): allowed, but
          # flagged, so a site left in report-only is noticed.
          if grep -qi "^content-security-policy:" "$WORK/headers.txt"; then
            echo "Header present: content-security-policy (enforced)"
          elif grep -qi "^content-security-policy-report-only:" "$WORK/headers.txt"; then
            echo "::warning::The Content-Security-Policy is report-only (SECURITY_CSP_ENFORCE=false in .env)."
          else
            echo "::error::$SITE_URL/ answered without a Content-Security-Policy header."
            FAILED=1
          fi
          # HSTS is sent only when PHP sees the request as HTTPS. A warning, not a
          # failure, until the first deploy has shown LiteSpeed passes that through.
          if grep -qi "^strict-transport-security:" "$WORK/headers.txt"; then
            echo "Header present: strict-transport-security"
          else
            echo "::warning::$SITE_URL/ answered without Strict-Transport-Security: check that the app sees HTTPS (TrustProxies / HTTPS=on)."
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Smoke check failed: the live site does not load its own pages or build assets (see above). The deploy is NOT healthy."
            exit 1
          fi
          echo "== Smoke check passed: $SITE_URL/ answered 200, $SITE_URL/login answered 200 or handed over to central sign-in, and so did all $(wc -l < "$WORK/unique" | tr -d ' ') build asset(s) they reference (listed above)."

      - name: Probe the application folder from outside
        # Public requests only (no SSH, nothing is read): the app folder next to the docroot
        # must answer 403/404 (or a 301/302 to the login), never 200. Found 2026-10-20
        # serving its database, logs and vendor/ on four platforms. Runs after the site is
        # live again, so it can only turn the run red. Only status codes are printed.
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -uo pipefail
          KEY="$(basename "$DEPLOY_PATH")"
          [ -n "$KEY" ] && [ "$KEY" != "/" ] || { echo "::error::cannot work out the app folder name; the probe did not run"; exit 1; }
          EXPOSED=0
          UNVERIFIED=0
          # A 200 alone proves nothing: the host's bot protection answers GitHub's runners with its own 200 page
          # for ANY address (2026-11-27: every path "answered 200" while each one was 403/404 for everyone else).
          # A path counts as exposed only when what came back IS that file. Both the app-folder path ($KEY/...)
          # and the site root are probed: since the document root moved to public/, the app folder is no longer
          # under the web root at all, so the root paths are the ones that would show a mistake now.
          signature() {
            case "$1" in
              *.env|*.env.bak-secrets) grep -qE '^(APP_KEY|DB_CONNECTION|APP_ENV)=' "$2" ;;
              *.sqlite) head -c 16 "$2" | grep -q 'SQLite format' ;;
              *composer.json) grep -q '"require"' "$2" ;;
              *composer.lock) grep -q '"packages"' "$2" ;;
              *laravel.log) grep -qE '\] (local|production|staging)\.(ERROR|INFO|WARNING|DEBUG)' "$2" ;;
              *autoload.php|*artisan) grep -q '<?php' "$2" ;;
              *phpunit.xml) grep -q '<phpunit' "$2" ;;
              *) return 1 ;;
            esac
          }
          BODY="$(mktemp)"
          for BASE in "$KEY/" ""; do
            for P in .env .env.bak-secrets artisan composer.json composer.lock database/database.sqlite storage/logs/laravel.log vendor/autoload.php phpunit.xml; do
              CODE=$(curl -s -o "$BODY" -m 15 -w '%{http_code}' "$SITE_URL/$BASE$P" || true)
              if [ "$CODE" = "200" ] && signature "$P" "$BODY"; then
                echo "::error::EXPOSED /$BASE$P answered 200 with the file itself"; EXPOSED=1
              elif [ "$CODE" = "200" ]; then
                echo "200 /$BASE$P - not the file ($(wc -c < "$BODY" | tr -d ' ') bytes; a challenge page?)"; UNVERIFIED=$((UNVERIFIED + 1))
              elif [ "$CODE" = "000" ]; then
                echo "000 /$BASE$P (no answer)"; UNVERIFIED=$((UNVERIFIED + 1))
              else
                echo "$CODE /$BASE$P"
              fi
            done
          done
          rm -f "$BODY"
          [ "$UNVERIFIED" -eq 0 ] || echo "::warning::$UNVERIFIED probe request(s) were not answered by the site itself; those paths are unverified from here."
          if [ "$EXPOSED" -ne 0 ]; then
            echo "::error::Application files are readable over HTTP (database, logs or vendor/ may be downloadable). Run the App Folder Guard workflow in InfoDot (mode apply) or add the deny file by hand, then re-run."
            exit 1
          fi
          echo "== App-folder probe: no sensitive file is served ($((18 - UNVERIFIED)) of 18 requests answered by the site)."
